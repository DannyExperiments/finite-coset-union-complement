name: Lean verification

on:
  push:
    branches: [main]
    paths:
      - "formalization/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: [main]
    paths:
      - "formalization/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and replay both Lean certificates through the kernel
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization
          build: true
          leanchecker: true
          use-mathlib-cache: true

